# Configuracao do banco de dados H2 (em memoria)
# O console do H2 e registrado em /h2-console pela classe H2ConsoleConfig
spring.datasource.url=jdbc:h2:mem:clinicadb
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Permite usar PUT e DELETE nos formularios HTML (campo oculto "_method" gerado pelo th:method)
spring.mvc.hiddenmethod.filter.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false

# Idioma fixo em portugues (datas como "segunda-feira, 16 de novembro de 2026")
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
