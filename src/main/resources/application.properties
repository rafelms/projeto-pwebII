# Configuracao do banco de dados H2 (em memoria)
spring.datasource.url=jdbc:h2:mem:clinicadb
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 em /h2-console (autoconfigurado pelo modulo spring-boot-h2console)
spring.h2.console.enabled=true

# JPA / Hibernate
# Com ddl-auto=create o Hibernate cria as tabelas e em seguida executa o import.sql
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Permite usar PUT e DELETE nos formularios HTML (campo oculto "_method" gerado pelo th:method)
spring.mvc.hiddenmethod.filter.enabled=true

# Idioma fixo em portugues (datas como "segunda-feira, 16 de novembro de 2026" e valores como "R$ 250,00")
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
