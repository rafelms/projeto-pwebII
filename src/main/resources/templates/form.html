<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Funcionário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 15px; background-color: #28A745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background-color: #6c757d; text-decoration: none; display: inline-block; padding: 8px 12px; }
    </style>
</head>
<body>
    <h1 th:text="${funcionario.id == null ? 'Cadastrar Funcionário' : 'Editar Funcionário'}">Cadastrar Funcionário</h1>
    
    <form th:action="@{/funcionarios/salvar}" th:object="${funcionario}" method="post">
        
        <input type="hidden" th:field="*{id}" />
        
        <div class="form-group">
            <label>Nome:</label>
            <input type="text" th:field="*{nome}" required />
        </div>
        
        <div class="form-group">
            <label>Departamento:</label>
            <!-- Substituímos o input de texto por um select iterando o Enum -->
            <select th:field="*{departamento}" required>
                <option value="" disabled selected>Selecione...</option>
                <option th:each="dept : ${departamentos}" 
                        th:value="${dept}" 
                        th:text="${dept}">Departamento</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Salário (R$):</label>
            <!-- Vincula ao BigDecimal -->
            <input type="number" step="0.01" th:field="*{salario}" required />
        </div>
        
        <button type="submit" class="btn">Salvar</button>
        <a th:href="@{/funcionarios}" class="btn btn-cancel">Cancelar</a>
    </form>
</body>
</html>
