<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Funcionário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 15px; background-color: #28A745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background-color: #6c757d; text-decoration: none; display: inline-block; padding: 8px 12px; }
    </style>
</head>
<body>
    <!-- Verifica dinamicamente (com condicional if ternário do Java) se o ID é nulo.
         Se for nulo, exibe o texto 'Cadastrar Funcionário'. Se já existir ID, exibe 'Editar Funcionário'.
         O objeto 'funcionario' foi enviado pelo FuncionarioController. -->
    <h1 th:text="${funcionario.id == null ? 'Cadastrar Funcionário' : 'Editar Funcionário'}">Cadastrar Funcionário</h1>
    
    <!-- O th:action define para qual URL do Controller os dados serão enviados (usando verbo POST).
         O th:object="${funcionario}" diz ao Thymeleaf que os campos deste formulário 
         irão se referir ao objeto Java enviado pelo model do Controller. -->
    <form th:action="@{/funcionarios/salvar}" th:object="${funcionario}" method="post">
        
        <!-- O th:field faz a amarração (binding) entre o input do HTML e o atributo da classe Java.
             Neste caso amarra o ID, mas o campo fica invisível (type="hidden") porque o usuário não deve editá-lo. -->
        <input type="hidden" th:field="*{id}" />
        
        <div class="form-group">
            <label>Nome:</label>
            <!-- Vincula automaticamente o valor digitado neste input ao atributo 'nome' da classe Java -->
            <input type="text" th:field="*{nome}" required />
        </div>
        
        <div class="form-group">
            <label>Departamento:</label>
            <!-- Vincula automaticamente ao atributo 'departamento' da classe Java -->
            <input type="text" th:field="*{departamento}" required />
        </div>
        
        <div class="form-group">
            <label>Salário (R$):</label>
            <!-- Vincula automaticamente ao atributo 'salario' da classe Java -->
            <input type="number" step="0.01" th:field="*{salario}" required />
        </div>
        
        <!-- Ao clicar no submit, o form chama a URL /funcionarios/salvar passando o objeto mapeado -->
        <button type="submit" class="btn">Salvar</button>
        <!-- Apenas um link normal apontando para o Controller principal da listagem, cancelando a operação -->
        <a th:href="@{/funcionarios}" class="btn btn-cancel">Cancelar</a>
    </form>
</body>
</html>
