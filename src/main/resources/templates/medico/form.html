<!DOCTYPE html>
<!--
    medico/form.html - Formulário de Cadastro/Edição de Médico

    Esta página "decora" o layout.html usando layout:decorate="~{layout}",
    herdando toda a estrutura (navbar, footer, CSS, JS) e substituindo
    APENAS a área de conteúdo via layout:fragment="conteudo".

    NÃO é necessário incluir header nem footer aqui — o layout já faz isso.

    Dados recebidos do MedicoController:
    - ${medico}: objeto Medico (vazio para novo, preenchido para edição)

    Campos do formulário (conforme hierarquia de herança):
    - nome, cpf: herdados de PessoaFisica
    - email, telefone: herdados de Pessoa
    - crm: atributo específico da classe Medico
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<!-- layout:decorate="~{layout}" indica que esta página herda o layout.html -->
<head>
    <!-- O título será combinado com o padrão do layout: "Formulário de Médico - Sistema Médico" -->
    <title>Formulário de Médico</title>
</head>
<body>

<!-- layout:fragment="conteudo" substitui a área de conteúdo do layout mestre -->
<div layout:fragment="conteudo">

    <!--
        Título dinâmico: exibe "Editar Médico" se o objeto tem ID (edição),
        ou "Novo Médico" se o ID é null (cadastro novo).
    -->
    <h2 th:text="${medico.id != null ? 'Editar Médico' : 'Novo Médico'}"></h2>

    <!-- Bootstrap grid: centraliza o formulário em 8 de 12 colunas -->
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Card Bootstrap para dar destaque visual ao formulário -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <!--
                        Verbo HTTP: medico novo -> POST /medicos; edição -> PUT /medicos/{id} (o id vai na URL).
                        th:method="put" gera method="post" + campo oculto "_method" com o valor "put".
                        th:object="${medico}" vincula o formulário ao objeto Medico do model.
                        th:field="*{campo}" faz o binding bidirecional entre o input e o atributo do objeto.
                    -->
                    <!--
                        VALIDAÇÃO (Bean Validation + Thymeleaf):
                        - novalidate desativa a validação nativa do navegador (required, type=email),
                          garantindo que as regras sejam aplicadas e exibidas pelo BACK-END.
                        - th:errorclass="is-invalid" adiciona a classe de erro do Bootstrap
                          (borda vermelha) somente quando o campo possui erro no BindingResult.
                        - th:errors="*{campo}" exibe a(s) mensagem(ns) definidas nas anotações.
                    -->
                    <form th:action="${medico.id == null} ? @{/medicos} : @{/medicos/{id}(id=${medico.id})}"
                          th:method="${medico.id == null} ? 'post' : 'put'"
                          th:object="${medico}" novalidate>

                        <!-- Resumo exibido quando o formulário volta do servidor com erros -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i> Corrija os campos destacados abaixo.
                        </div>

                        <!-- Campo nome: herdado de PessoaFisica (@NotBlank, @Size) -->
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}"
                                   th:errorclass="is-invalid" placeholder="Nome completo">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <!-- Campo cpf: herdado de PessoaFisica (@NotBlank, @Pattern, unicidade no controller) -->
                        <div class="mb-3">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpf" th:field="*{cpf}"
                                   th:errorclass="is-invalid" placeholder="999.999.999-99">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                        </div>

                        <!-- Campo email: herdado de Pessoa (@NotBlank, @Email, @Size) -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   th:errorclass="is-invalid" placeholder="nome@dominio.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Campo telefone: herdado de Pessoa (@NotBlank, @Pattern) -->
                        <div class="mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="telefone" th:field="*{telefone}"
                                   th:errorclass="is-invalid" placeholder="(99) 99999-9999">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                        </div>

                        <!-- Campo crm: exclusivo da classe Medico (@NotBlank, @Pattern, unicidade no controller) -->
                        <div class="mb-3">
                            <label for="crm" class="form-label">CRM</label>
                            <input type="text" class="form-control" id="crm" th:field="*{crm}"
                                   th:errorclass="is-invalid" placeholder="CRM-SP 12345">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('crm')}" th:errors="*{crm}"></div>
                        </div>

                        <!-- Especialidade e valor da consulta: aparecem no agendamento (o valor vira a sugestão) -->
                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label for="especialidade" class="form-label">Especialidade</label>
                                <input type="text" class="form-control" id="especialidade" th:field="*{especialidade}"
                                       th:errorclass="is-invalid" placeholder="Cardiologia">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('especialidade')}" th:errors="*{especialidade}"></div>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label for="valorConsulta" class="form-label">Valor da consulta (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="valorConsulta" th:field="*{valorConsulta}"
                                       th:errorclass="is-invalid" placeholder="150.00">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('valorConsulta')}" th:errors="*{valorConsulta}"></div>
                            </div>
                        </div>

                        <!--
                            CONTA DE ACESSO (Spring Security): Pessoa -> Usuario (um-para-um).
                            "*{usuario.usuario}" acessa o login dentro do objeto medico.usuario.
                            A senha NÃO usa th:field para que o hash gravado nunca seja enviado
                            de volta ao navegador; na edição, deixá-la em branco mantém a atual.
                            Um médico novo recebe o perfil inicial MEDICO.
                        -->
                        <h5 class="mt-4"><i class="bi bi-shield-lock"></i> Conta de acesso</h5>
                        <p class="text-muted small">Perfil inicial: <span class="badge text-bg-info">MEDICO</span></p>

                        <!-- id da conta: usado só para o texto de ajuda da senha; o controller sempre busca a conta no banco -->
                        <input type="hidden" th:field="*{usuario.id}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="login" class="form-label">Usuário</label>
                                <input type="text" class="form-control" id="login" th:field="*{usuario.usuario}"
                                       th:errorclass="is-invalid" placeholder="ex.: ana.costa" autocomplete="off">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('usuario.usuario')}" th:errors="*{usuario.usuario}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" name="usuario.senha"
                                       th:classappend="${#fields.hasErrors('usuario.senha')} ? 'is-invalid'"
                                       th:placeholder="${medico.usuario.id != null ? 'Deixe em branco para manter a atual' : 'Mínimo 3 caracteres'}"
                                       autocomplete="new-password">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('usuario.senha')}" th:errors="*{usuario.senha}"></div>
                            </div>
                        </div>

                        <!-- Botões de ação com d-flex gap-2 para espaçamento horizontal -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Salvar
                            </button>
                            <!-- Link para cancelar e voltar à lista de médicos -->
                            <a th:href="@{/medicos}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
