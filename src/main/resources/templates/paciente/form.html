<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${paciente.id != null ? 'Editar Paciente' : 'Novo Paciente'}"></h2>

    <form th:action="@{/pacientes/salvar}" th:object="${paciente}" method="post">

        <!-- Campo oculto para o id (usado na edição) -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
        </div>

        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="telefone" th:field="*{telefone}" required>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/pacientes" class="btn btn-secondary">Cancelar</a>

    </form>

</div>
</body>
</html>
