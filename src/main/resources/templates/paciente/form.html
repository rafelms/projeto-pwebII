<!DOCTYPE html>
<!--
    paciente/form.html - Formulário de Cadastro/Edição de Paciente

    Esta página "decora" o layout.html usando layout:decorate="~{layout}",
    herdando toda a estrutura (navbar, footer, CSS, JS) e substituindo
    apenas a área de conteúdo via layout:fragment="conteudo".

    Dados recebidos do PacienteController:
    - ${paciente}: objeto Paciente (vazio para novo, preenchido para edição)

    O título do formulário é dinâmico:
    - "Novo Paciente" quando paciente.id é null (cadastro)
    - "Editar Paciente" quando paciente.id tem valor (edição)

    Campos do formulário refletem a hierarquia de herança:
    - nome, cpf: herdados de PessoaFisica
    - email, telefone: herdados de Pessoa
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<!-- layout:decorate="~{layout}" indica que esta página herda o layout.html -->
<head>
    <!-- O título será combinado com o padrão do layout: "Formulário de Paciente - Clínica Saúde Total" -->
    <title>Formulário de Paciente</title>
</head>
<body>

<!-- layout:fragment="conteudo" substitui a área de conteúdo do layout mestre -->
<div layout:fragment="conteudo">

    <!--
        Título dinâmico: exibe "Editar Paciente" se o objeto tem ID (edição),
        ou "Novo Paciente" se o ID é null (cadastro novo).
    -->
    <h2 th:text="${paciente.id != null ? 'Editar Paciente' : 'Novo Paciente'}"></h2>

    <!-- Bootstrap grid: centraliza o formulário em 8 de 12 colunas -->
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Card Bootstrap para dar destaque visual ao formulário -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <!--
                        th:action="@{/pacientes/salvar}" define a URL de destino do POST.
                        th:object="${paciente}" vincula o formulário ao objeto Paciente do model.
                        th:field="*{campo}" faz o binding bidirecional entre o input e o atributo do objeto.
                    -->
                    <form th:action="@{/pacientes/salvar}" th:object="${paciente}" method="post">

                        <!-- Campo oculto com o ID - essencial para edição (identifica o registro existente) -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Campos herdados de PessoaFisica -->
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <!-- th:field="*{nome}" vincula ao atributo nome de PessoaFisica -->
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
                        </div>

                        <div class="mb-3">
                            <label for="cpf" class="form-label">CPF</label>
                            <!-- th:field="*{cpf}" vincula ao atributo cpf de PessoaFisica -->
                            <input type="text" class="form-control" id="cpf" th:field="*{cpf}" required>
                        </div>

                        <!-- Campos herdados de Pessoa (superclasse) -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <!-- th:field="*{email}" vincula ao atributo email de Pessoa -->
                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <!-- th:field="*{telefone}" vincula ao atributo telefone de Pessoa -->
                            <input type="text" class="form-control" id="telefone" th:field="*{telefone}" required>
                        </div>

                        <!-- Botões de ação com d-flex gap-2 para espaçamento horizontal -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Salvar
                            </button>
                            <!-- Link para cancelar e voltar à lista de pacientes -->
                            <a th:href="@{/pacientes}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
