<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <!-- Barra de navegação simples -->
    <nav class="mb-3">
        <a href="/pacientes" class="btn btn-outline-primary btn-sm me-1">Pacientes</a>
        <a href="/medicos" class="btn btn-outline-primary btn-sm me-1">Médicos</a>
        <a href="/consultas" class="btn btn-outline-primary btn-sm">Consultas</a>
    </nav>

    <h2>Lista de Pacientes</h2>
    <a href="/pacientes/novo" class="btn btn-success mb-3">Novo Paciente</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pacientes}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.cpf}"></td>
            <td th:text="${p.email}"></td>
            <td th:text="${p.telefone}"></td>
            <td>
                <a th:href="@{/pacientes/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/pacientes/excluir/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Deseja realmente excluir?')">Excluir</a>
                <button class="btn btn-info btn-sm" type="button"
                        th:data-bs-target="'#modal-' + ${p.id}"
                        data-bs-toggle="modal">
                    Ver Consultas
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Modais de consultas por paciente -->
    <div th:each="p : ${pacientes}">
        <div class="modal fade" th:id="'modal-' + ${p.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="'Consultas de ' + ${p.nome}"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <div th:if="${p.consultaList == null or #lists.isEmpty(p.consultaList)}">
                            <p>Nenhuma consulta cadastrada.</p>
                        </div>
                        <table class="table table-sm" th:unless="${p.consultaList == null or #lists.isEmpty(p.consultaList)}">
                            <thead>
                            <tr>
                                <th>Data</th>
                                <th>Médico</th>
                                <th>Valor</th>
                                <th>Observação</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${p.consultaList}">
                                <td th:text="${c.dataFormatada}"></td>
                                <td th:text="${c.medico != null ? c.medico.nome : 'N/A'}"></td>
                                <td th:text="'R$ ' + ${#numbers.formatDecimal(c.valor, 1, 2)}"></td>
                                <td th:text="${c.observacao}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
