<!DOCTYPE html>
<!--
    acesso-negado.html - Página de Acesso Negado (HTTP 403)

    Exibida quando um usuário AUTENTICADO tenta acessar uma URL que o seu
    perfil não permite. Configurada em SecurityConfiguration com
    exceptionHandling().accessDeniedPage("/acesso-negado").

    Usa sec:authentication para mostrar quem está logado e com quais perfis.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Acesso negado</title>
</head>
<body>

<div layout:fragment="conteudo">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <i class="bi bi-shield-lock text-danger" style="font-size: 4rem;"></i>
            <h2 class="mt-3">Acesso negado</h2>
            <p class="text-muted">
                O usuário <strong sec:authentication="name">usuário</strong>
                (perfil <span sec:authentication="principal.authorities">[ROLE_USER]</span>)
                não tem permissão para acessar esta página.
            </p>
            <a th:href="@{/consultas}" class="btn btn-primary">
                <i class="bi bi-arrow-left"></i> Voltar para o início
            </a>
        </div>
    </div>
</div>

</body>
</html>
