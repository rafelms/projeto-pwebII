<!DOCTYPE html>
<!--
    layout.html - Template Mestre (Layout Principal)

    Este arquivo é o "esqueleto" de todas as páginas da aplicação.
    Utiliza o Thymeleaf Layout Dialect (layout:decorate) para que cada
    página filha herde esta estrutura e substitua apenas a área de conteúdo.

    Vantagens desta abordagem:
    - Header (navbar) e Footer são definidos UMA ÚNICA VEZ aqui,
      sem necessidade de cada página incluí-los individualmente.
    - O <head> com Bootstrap CSS/JS também fica centralizado aqui.
    - Cada página filha só precisa declarar layout:decorate="~{layout}"
      e definir seu conteúdo via layout:fragment="conteudo".
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport para responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
        Nas versões mais novas do Thymeleaf Layout Dialect (3.x+), o 
        layout:title-pattern foi removido. O comportamento padrão é que 
        a tag <title> da página filha simplesmente sobrescreva esta tag.
    -->
    <title>Sistema Médico</title>

    <!-- Bootstrap 5 CSS via CDN — carregado uma única vez aqui no layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons — biblioteca de ícones vetoriais para navbar e botões -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!--
        Inclusão do fragmento de cabeçalho (navbar) definido em fragments/header.html.
        O header é referenciado APENAS aqui no layout, eliminando a duplicação
        que existia antes, onde cada página incluía o header individualmente.
    -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!--
        Área de conteúdo principal.
        O atributo layout:fragment="conteudo" define o ponto de substituição:
        cada página filha fornece seu próprio conteúdo para esta área.
        As classes "d-flex flex-column min-vh-100" no body e "flex-grow-1" no main
        garantem que o rodapé fique sempre preso na parte inferior (Sticky Footer).
    -->
    <main class="container mt-4 mb-5 flex-grow-1">
        <!--
            Mensagens "flash" enviadas pelos controllers via RedirectAttributes
            (ex.: "Paciente salvo com sucesso!" ou "Não é possível excluir...").
            Ficam no layout para aparecerem em qualquer página após o redirect.
        -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div layout:fragment="conteudo">
            <!-- Conteúdo padrão (placeholder) — será substituído pela página filha -->
            <p>Conteúdo padrão do layout (será substituído pela página filha).</p>
        </div>
    </main>

    <!--
        Inclusão do fragmento de rodapé definido em fragments/footer.html.
        O footer é referenciado APENAS aqui no layout, eliminando a necessidade
        de cada página incluí-lo individualmente — atendendo a exigência
        de que elementos estáticos como o footer sejam definidos uma única vez.
    -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JavaScript via CDN — necessário para componentes interativos
         (navbar responsiva, modais, dropdowns, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
