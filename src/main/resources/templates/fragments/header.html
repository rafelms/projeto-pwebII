<!DOCTYPE html>
<!--
    header.html - Fragmento da Barra de Navegação (Navbar)

    Contém o fragment "header" que é reutilizado pelo layout.html
    através de th:replace="~{fragments/header :: header}".

    IMPORTANTE: Este fragmento é incluído APENAS no layout.html (uma única vez).
    As páginas individuais NÃO precisam referenciá-lo — o layout cuida disso.

    Personalização para o Sistema Médico:
    - Cor de fundo: bg-primary (azul Bootstrap) com texto claro (navbar-dark)
    - Brand: nome do sistema com ícone de hospital (Bootstrap Icons)
    - Links: Pacientes, Médicos e Consultas com ícones
    - Responsividade: navbar-expand-lg faz a navbar colapsar em telas menores
-->
<!--
    Integração com o Spring Security (thymeleaf-extras-springsecurity6):
    - sec:authorize="expressão" só renderiza o elemento se a expressão for verdadeira;
    - sec:authentication="name" exibe o nome do usuário logado.
    Ocultar um menu NÃO protege a URL: a proteção real está na SecurityConfiguration.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
    th:fragment="header" define este bloco como fragment reutilizável.
    Classes Bootstrap utilizadas:
    - navbar: componente base de navegação
    - navbar-expand-lg: colapsa em telas menores que lg (992px)
    - navbar-dark: texto claro para fundo escuro
    - bg-primary: fundo azul padrão do Bootstrap
    - shadow-sm: sombra sutil para dar profundidade visual
-->
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <!-- Brand (logotipo/nome do sistema) com link para a página inicial -->
        <a class="navbar-brand fw-bold" th:href="@{/pacientes}">
            <i class="bi bi-hospital"></i> Sistema Médico
        </a>

        <!-- Botão hambúrguer para telas menores — exibe o menu colapsado -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu de navegação colapsável — ms-auto alinha os itens à direita -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <!-- Link para a lista de pacientes -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pacientes}">
                        <i class="bi bi-people"></i> Pacientes
                    </a>
                </li>
                <!-- Link para a lista de médicos -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/medicos}">
                        <i class="bi bi-person-badge"></i> Médicos
                    </a>
                </li>
                <!-- Link para a lista de consultas -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/consultas}">
                        <i class="bi bi-calendar-check"></i> Consultas
                    </a>
                </li>
                <!-- Console do banco H2: visível apenas para o perfil ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/h2-console}" target="_blank">
                        <i class="bi bi-database"></i> H2
                    </a>
                </li>

                <!--
                    Usuário logado: nome, perfil e botão Sair.
                    O logout é um formulário POST (e não um link GET) para que o
                    token CSRF seja enviado; th:action insere esse token automaticamente.
                -->
                <li class="nav-item dropdown ms-lg-3" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i> <span sec:authentication="name">usuário</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <span class="dropdown-item-text small text-muted">
                                Perfil:
                                <span sec:authorize="hasRole('ADMIN')" class="badge text-bg-danger">ADMIN</span>
                                <span sec:authorize="hasRole('RECEPCAO')" class="badge text-bg-success">RECEPÇÃO</span>
                                <span sec:authorize="hasRole('MEDICO')" class="badge text-bg-info">MÉDICO</span>
                            </span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3">
                                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                    <i class="bi bi-box-arrow-right"></i> Sair
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
