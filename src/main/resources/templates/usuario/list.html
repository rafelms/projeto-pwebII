<!DOCTYPE html>
<!--/*
    usuario/list.html - Listagem das contas de acesso (somente ADMIN)

    Esta página "decora" o layout.html usando layout:decorate="~{layout}",
    herdando toda a estrutura (navbar, footer, CSS, JS) e substituindo
    APENAS a área de conteúdo via layout:fragment="conteudo".

    Dados recebidos do UsuarioController (método listar):
    - ${usuarios}: lista de objetos Usuario vindos do banco de dados

    A coluna "Senha (hash)" mostra o início do valor gravado no banco:
    é um hash BCrypt ($2a$10$...), e não a senha digitada.
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<!--/* layout:decorate="~{layout}" indica que esta página herda o layout.html */-->
<head>
    <title>Usuários</title>
</head>
<body>

<!--/* layout:fragment="conteudo" substitui a área de conteúdo do layout mestre */-->
<div layout:fragment="conteudo">

    <h2>Usuários do sistema</h2>
    <p class="text-muted">
        Contas gravadas nas tabelas <code>usuario</code>, <code>perfil</code> e <code>usuario_perfil</code>.
        Para criar a conta de um paciente ou médico, use o cadastro da própria pessoa.
    </p>

    <table class="table table-striped table-hover">
        <!--/* Cabeçalho da tabela com fundo azul (table-primary) */-->
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Usuário</th>
            <th>Perfis</th>
            <th>Senha (hash)</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.usuario}"></td>
            <td>
                <!--/* Um usuário pode ter vários perfis (muitos-para-muitos) */-->
                <span th:each="p : ${u.perfis}" class="badge text-bg-primary me-1" th:text="${p.nome}"></span>
            </td>
            <!--/* #strings.abbreviate corta o hash para não ocupar a tela inteira */-->
            <td><code th:text="${#strings.abbreviate(u.senha, 24)}"></code></td>
            <td>
                <!--/* Abre o modal "Alterar senha" desta conta: "#modalSenha-1", etc. */-->
                <button class="btn btn-warning btn-sm" type="button"
                        th:data-bs-target="'#modalSenha-' + ${u.id}"
                        data-bs-toggle="modal">
                    <i class="bi bi-key"></i> Alterar senha
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <!--/*
        Um modal "Alterar senha" por conta, como nas outras listagens (th:each + id dinâmico).
        Envia PUT /usuarios/{id}/senha (th:method="put" gera o campo oculto "_method" e o th:action
        inclui o token CSRF). O ADMIN não precisa da senha atual da conta: só da nova e da confirmação.
        Ao terminar, o controller redireciona para /usuarios, recarregando a página com a mensagem.
    */-->
    <div th:each="u : ${usuarios}">
        <div class="modal fade" th:id="'modalSenha-' + ${u.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-warning">
                        <h5 class="modal-title" th:text="'Alterar senha de ' + ${u.usuario}"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <form th:action="@{/usuarios/{id}/senha(id=${u.id})}" th:method="put" novalidate>
                        <div class="modal-body">
                            <div class="mb-2">
                                <label th:for="'novaSenha-' + ${u.id}" class="form-label small">Nova senha</label>
                                <input type="password" class="form-control" th:id="'novaSenha-' + ${u.id}"
                                       name="novaSenha" autocomplete="new-password">
                            </div>
                            <div class="mb-2">
                                <label th:for="'confirmacao-' + ${u.id}" class="form-label small">Repita a nova senha</label>
                                <input type="password" class="form-control" th:id="'confirmacao-' + ${u.id}"
                                       name="confirmacao" autocomplete="new-password">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="bi bi-check-lg"></i> Salvar nova senha
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
