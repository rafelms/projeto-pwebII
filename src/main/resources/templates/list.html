<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Funcionários</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 8px 12px; background-color: #007BFF; color: white; text-decoration: none; border-radius: 4px; }
        .btn-danger { background-color: #DC3545; }
        .btn-edit { background-color: #28A745; }
    </style>
</head>
<body>
    <h1>Lista de Funcionários</h1>
    <!-- O atributo th:href monta a URL dinamicamente apontando para o mapeamento /funcionarios/novo do nosso Controller -->
    <a th:href="@{/funcionarios/novo}" class="btn">Cadastrar Novo Funcionário</a>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Departamento</th>
                <th>Salário (R$)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <!-- O atributo th:each funciona como um laço de repetição (FOR). 
                 Ele percorre a lista de 'funcionarios' que foi enviada pelo FuncionarioController 
                 (no model.addAttribute) e cria uma nova linha <tr> no HTML para cada funcionário -->
            <tr th:each="funcionario : ${funcionarios}">
                
                <!-- O atributo th:text diz ao Thymeleaf para trocar o conteúdo estático da tag (como o '1' ou 'Nome') 
                     pelo valor dinâmico vindo da nossa classe Funcionario do Java -->
                <td th:text="${funcionario.id}">1</td>
                <td th:text="${funcionario.nome}">Nome</td>
                <td th:text="${funcionario.departamento}">Departamento</td>
                <td th:text="${funcionario.salario}">0.0</td>
                
                <td>
                    <!-- Aqui o th:href substitui o {id} na URL pelo valor real do funcionário atual (funcionario.id)
                         Gerando, por exemplo, o link: /funcionarios/editar/5 -->
                    <a th:href="@{/funcionarios/editar/{id}(id=${funcionario.id})}" class="btn btn-edit">Editar</a>
                    
                    <!-- Assim como o editar, geramos um link dinâmico que bate no método de exclusão do controller -->
                    <a th:href="@{/funcionarios/excluir/{id}(id=${funcionario.id})}" class="btn btn-danger" onclick="return confirm('Tem certeza que deseja excluir este funcionário?');">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
