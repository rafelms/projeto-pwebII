<!DOCTYPE html>
<!--
    consulta/list.html - Página de Listagem de Consultas

    Esta página "decora" o layout.html usando layout:decorate="~{layout}",
    herdando toda a estrutura (navbar, footer, CSS, JS) e substituindo
    APENAS a área de conteúdo via layout:fragment="conteudo".

    NÃO é necessário incluir header nem footer aqui — o layout já faz isso.

    Dados recebidos do ConsultaController (método listar):
    - ${consultas}: lista de objetos Consulta vindos do banco de dados
    - ${pacientes}, ${medicos}: listas para os selects do filtro

    Funcionalidades:
    - Filtro por período, paciente, médico e valor mínimo
    - Tabela com data, horário, paciente, médico, tipo, situação e valor
    - Ações: Ver (abre um modal com todos os dados), Editar e Excluir (DELETE)
    - #temporals.format formata a data (LocalDate) no padrão brasileiro
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<!-- layout:decorate="~{layout}" indica que esta página herda o layout.html -->
<head>
    <title>Consultas</title>
</head>
<body>

<!-- layout:fragment="conteudo" substitui a área de conteúdo do layout mestre -->
<div layout:fragment="conteudo">

    <h2>Lista de Consultas</h2>

    <!-- Botão para criar nova consulta — abre o formulário (GET /consultas/nova) -->
    <a th:href="@{/consultas/nova}" class="btn btn-success mb-3"
       sec:authorize="hasAnyRole('ADMIN', 'RECEPCAO')">
        <i class="bi bi-plus-circle"></i> Nova Consulta
    </a>

    <!--
        Filtro de consultas (GET /consultas?dataInicio=...&dataFim=...).
        th:object="${filtro}" liga o formulário ao FiltroConsulta, validado com @Valid
        no controller (inclui a anotação customizada @PeriodoValido).
    -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form th:action="@{/consultas}" th:object="${filtro}" method="get" class="row g-2 align-items-start" novalidate>
                <div class="col-md-2">
                    <label for="dataInicio" class="form-label small">Data inicial</label>
                    <input type="date" class="form-control" id="dataInicio" th:field="*{dataInicio}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}"></div>
                </div>
                <div class="col-md-2">
                    <label for="dataFim" class="form-label small">Data final</label>
                    <input type="date" class="form-control" id="dataFim" th:field="*{dataFim}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dataFim')}" th:errors="*{dataFim}"></div>
                </div>
                <div class="col-md-2">
                    <label for="pacienteId" class="form-label small">Paciente</label>
                    <select class="form-select" id="pacienteId" th:field="*{pacienteId}" th:errorclass="is-invalid">
                        <option value="">Todos</option>
                        <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('pacienteId')}" th:errors="*{pacienteId}"></div>
                </div>
                <div class="col-md-2">
                    <label for="medicoId" class="form-label small">Médico</label>
                    <select class="form-select" id="medicoId" th:field="*{medicoId}" th:errorclass="is-invalid">
                        <option value="">Todos</option>
                        <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nome}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('medicoId')}" th:errors="*{medicoId}"></div>
                </div>
                <div class="col-md-2">
                    <label for="valorMinimo" class="form-label small">Valor mínimo (R$)</label>
                    <input type="number" step="0.01" class="form-control" id="valorMinimo" th:field="*{valorMinimo}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('valorMinimo')}" th:errors="*{valorMinimo}"></div>
                </div>
                <div class="col-md-2 d-flex gap-2" style="padding-top: 1.85rem;">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Filtrar</button>
                    <a th:href="@{/consultas}" class="btn btn-outline-secondary">Limpar</a>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-primary">
        <tr>
            <th>Data</th>
            <th>Horário</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Tipo</th>
            <th>Situação</th>
            <th>Valor</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${consultas}">
            <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy')}"></td>
            <td th:text="${c.horario}"></td>
            <td th:text="${c.paciente.nome}"></td>
            <td th:text="${c.medico.nome}"></td>
            <td th:text="${c.tipo.descricao}"></td>
            <!-- A cor do badge vem do próprio enum StatusConsulta -->
            <td><span class="badge" th:classappend="${c.status.cor}" th:text="${c.status.descricao}"></span></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(c.valor, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="text-nowrap">
                <!-- Ver: abre o modal com os dados da consulta (sem sair da página) -->
                <button type="button" class="btn btn-info btn-sm" data-bs-toggle="modal"
                        th:data-bs-target="'#modalConsulta-' + ${c.id}">
                    <i class="bi bi-eye"></i> Ver
                </button>
                <a th:href="@{/consultas/{id}/editar(id=${c.id})}" class="btn btn-warning btn-sm"
                   sec:authorize="hasAnyRole('ADMIN', 'RECEPCAO')">
                    <i class="bi bi-pencil"></i> Editar
                </a>
                <!--
                    Excluir usa o verbo DELETE: th:method="delete" gera um campo oculto "_method"
                    e o th:action inclui o token CSRF, que o Spring Security exige.
                -->
                <form th:action="@{/consultas/{id}(id=${c.id})}" th:method="delete" class="d-inline"
                      sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Deseja realmente excluir?')">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-trash"></i> Excluir
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(consultas)}">
            <td colspan="8" class="text-center text-muted">Nenhuma consulta encontrada.</td>
        </tr>
        </tbody>
    </table>

    <!--
        Modal de detalhes: um por consulta (th:each), com id dinâmico "modalConsulta-{id}"
        para corresponder ao data-bs-target do botão "Ver".
    -->
    <div th:each="c : ${consultas}" class="modal fade" th:id="'modalConsulta-' + ${c.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <div>
                        <h5 class="modal-title mb-0"><i class="bi bi-calendar-check"></i> Consulta</h5>
                        <small th:text="${#temporals.format(c.data, 'EEEE, dd ''de'' MMMM ''de'' yyyy')} + ' às ' + ${c.horario}"></small>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">
                    <!-- Situação, tipo e valor em destaque -->
                    <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
                        <span class="badge fs-6" th:classappend="${c.status.cor}" th:text="${c.status.descricao}"></span>
                        <span class="badge fs-6 text-bg-light border" th:text="${c.tipo.descricao}"></span>
                        <span class="ms-auto fs-4 fw-bold text-success"
                              th:text="'R$ ' + ${#numbers.formatDecimal(c.valor, 1, 'POINT', 2, 'COMMA')}"></span>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="border rounded p-3 h-100">
                                <h6 class="text-primary"><i class="bi bi-person"></i> Paciente</h6>
                                <p class="fw-semibold mb-1" th:text="${c.paciente.nome}"></p>
                                <p class="small text-muted mb-0">
                                    CPF: <span th:text="${c.paciente.cpf}"></span><br>
                                    <i class="bi bi-telephone"></i> <span th:text="${c.paciente.telefone}"></span><br>
                                    <i class="bi bi-envelope"></i> <span th:text="${c.paciente.email}"></span>
                                </p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="border rounded p-3 h-100">
                                <h6 class="text-primary"><i class="bi bi-person-badge"></i> Médico</h6>
                                <p class="fw-semibold mb-1" th:text="${c.medico.nome}"></p>
                                <p class="small text-muted mb-0">
                                    <span th:text="${c.medico.especialidade}"></span><br>
                                    <span th:text="${c.medico.crm}"></span><br>
                                    <i class="bi bi-telephone"></i> <span th:text="${c.medico.telefone}"></span>
                                </p>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="border rounded p-3">
                                <h6 class="text-primary"><i class="bi bi-chat-left-text"></i> Observação</h6>
                                <p class="mb-0" th:text="${c.observacao}" th:if="${c.observacao != null}"></p>
                                <p class="mb-0 text-muted fst-italic" th:if="${c.observacao == null}">Sem observações.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <a th:href="@{/consultas/{id}/editar(id=${c.id})}" class="btn btn-warning"
                       sec:authorize="hasAnyRole('ADMIN', 'RECEPCAO')">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
