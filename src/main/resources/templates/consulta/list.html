<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <!-- Barra de navegação simples -->
    <nav class="mb-3">
        <a href="/pacientes" class="btn btn-outline-primary btn-sm me-1">Pacientes</a>
        <a href="/medicos" class="btn btn-outline-primary btn-sm me-1">Médicos</a>
        <a href="/consultas" class="btn btn-outline-primary btn-sm">Consultas</a>
    </nav>

    <h2>Lista de Consultas</h2>
    <a href="/consultas/nova" class="btn btn-success mb-3">Nova Consulta</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Valor</th>
            <th>Observação</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${consultas}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.dataFormatada}"></td>
            <td th:text="${c.paciente != null ? c.paciente.nome : 'N/A'}"></td>
            <td th:text="${c.medico != null ? c.medico.nome : 'N/A'}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(c.valor, 1, 2)}"></td>
            <td th:text="${c.observacao}"></td>
            <td>
                <a th:href="@{/consultas/editar/{id}(id=${c.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/consultas/excluir/{id}(id=${c.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Deseja realmente excluir?')">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
