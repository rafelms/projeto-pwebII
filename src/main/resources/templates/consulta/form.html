<!DOCTYPE html>
<!--
    consulta/form.html - Formulário de Cadastro/Edição de Consulta

    Esta página "decora" o layout.html usando layout:decorate="~{layout}",
    herdando toda a estrutura (navbar, footer, CSS, JS) e substituindo
    APENAS a área de conteúdo via layout:fragment="conteudo".

    NÃO é necessário incluir header nem footer aqui — o layout já faz isso.

    Dados recebidos do ConsultaController:
    - ${consulta}: objeto Consulta (vazio para nova, preenchido para edição)
    - ${pacientes}: lista de pacientes para o <select> (dropdown)
    - ${medicos}: lista de médicos para o <select> (dropdown)

    Campos do formulário (conforme entidade Consulta):
    - data: LocalDateTime, renderizado como input datetime-local
    - valor: double, renderizado como input number com step 0.01
    - observacao: String, renderizado como textarea
    - paciente.id: selecionado via dropdown com lista de pacientes
    - medico.id: selecionado via dropdown com lista de médicos
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<!-- layout:decorate="~{layout}" indica que esta página herda o layout.html -->
<head>
    <!-- O título será combinado com o padrão do layout: "Formulário de Consulta - Sistema Médico" -->
    <title>Formulário de Consulta</title>
</head>
<body>

<!-- layout:fragment="conteudo" substitui a área de conteúdo do layout mestre -->
<div layout:fragment="conteudo">

    <!--
        Título dinâmico: exibe "Editar Consulta" se o objeto tem ID (edição),
        ou "Nova Consulta" se o ID é null (cadastro novo).
    -->
    <h2 th:text="${consulta.id != null ? 'Editar Consulta' : 'Nova Consulta'}"></h2>

    <!-- Bootstrap grid: centraliza o formulário em 8 de 12 colunas -->
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Card Bootstrap para dar destaque visual ao formulário -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <!--
                        th:action="@{/consultas/salvar}" define a URL de destino do POST.
                        th:object="${consulta}" vincula o formulário ao objeto Consulta do model.
                    -->
                    <!--
                        VALIDAÇÃO (Bean Validation + Thymeleaf):
                        - novalidate desativa a validação nativa do navegador,
                          garantindo que as regras sejam aplicadas e exibidas pelo BACK-END.
                        - th:errorclass="is-invalid" destaca o campo com erro (Bootstrap).
                        - th:errors="*{campo}" exibe as mensagens das anotações e das
                          regras de negócio registradas no controller (rejectValue).
                    -->
                    <form th:action="@{/consultas/salvar}" th:object="${consulta}" method="post" novalidate>

                        <!-- Resumo exibido quando o formulário volta do servidor com erros -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i> Corrija os campos destacados abaixo.
                        </div>

                        <!-- Campo oculto com o ID — essencial para edição (identifica o registro existente) -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Campo de data e hora — @NotNull + regras de horário no controller -->
                        <div class="mb-3">
                            <label for="data" class="form-label">Data e Hora</label>
                            <!-- th:field="*{data}" vincula ao atributo LocalDateTime data da Consulta -->
                            <input type="datetime-local" class="form-control" id="data" th:field="*{data}"
                                   th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></div>
                        </div>

                        <!-- Campo de valor — @NotNull, @DecimalMin e @DecimalMax -->
                        <div class="mb-3">
                            <label for="valor" class="form-label">Valor (R$)</label>
                            <!-- th:field="*{valor}" vincula ao atributo Double valor da Consulta -->
                            <input type="number" step="0.01" class="form-control" id="valor" th:field="*{valor}"
                                   th:errorclass="is-invalid" placeholder="150.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                        </div>

                        <!-- Campo de observação — @Size(max = 255) -->
                        <div class="mb-3">
                            <label for="observacao" class="form-label">Observação</label>
                            <!-- th:field="*{observacao}" vincula ao atributo String observacao da Consulta -->
                            <textarea class="form-control" id="observacao" th:field="*{observacao}" rows="3"
                                      th:errorclass="is-invalid"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('observacao')}" th:errors="*{observacao}"></div>
                        </div>

                        <!--
                            Dropdown de seleção de paciente.
                            th:field="*{paciente.id}" vincula o valor selecionado ao ID do paciente
                            no objeto Consulta (relação @ManyToOne).
                            th:each="p : ${pacientes}" popula as opções com todos os pacientes cadastrados.
                        -->
                        <div class="mb-3">
                            <label for="paciente" class="form-label">Paciente</label>
                            <!--
                                O erro é registrado no campo "paciente" (@NotNull / controller),
                                mas o select está ligado a "paciente.id"; por isso o destaque
                                usa th:classappend verificando os dois caminhos.
                            -->
                            <select class="form-select" id="paciente" th:field="*{paciente.id}"
                                    th:classappend="${#fields.hasErrors('paciente') or #fields.hasErrors('paciente.id')} ? 'is-invalid'">
                                <option value="">Selecione um paciente</option>
                                <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('paciente')}" th:errors="*{paciente}"></div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('paciente.id')}" th:errors="*{paciente.id}"></div>
                        </div>

                        <!--
                            Dropdown de seleção de médico.
                            th:field="*{medico.id}" vincula o valor selecionado ao ID do médico
                            no objeto Consulta (relação @ManyToOne).
                            th:each="m : ${medicos}" popula as opções com todos os médicos cadastrados.
                        -->
                        <div class="mb-3">
                            <label for="medico" class="form-label">Médico</label>
                            <select class="form-select" id="medico" th:field="*{medico.id}"
                                    th:classappend="${#fields.hasErrors('medico') or #fields.hasErrors('medico.id')} ? 'is-invalid'">
                                <option value="">Selecione um médico</option>
                                <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nome}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('medico')}" th:errors="*{medico}"></div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('medico.id')}" th:errors="*{medico.id}"></div>
                        </div>

                        <!-- Botões de ação com d-flex gap-2 para espaçamento horizontal -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Salvar
                            </button>
                            <!-- Link para cancelar e voltar à lista de consultas -->
                            <a th:href="@{/consultas}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
