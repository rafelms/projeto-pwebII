<!DOCTYPE html>
<!--
    consulta/form.html - Formulário de Cadastro/Edição de Consulta

    Esta página "decora" o layout.html usando layout:decorate="~{layout}",
    herdando toda a estrutura (navbar, footer, CSS, JS) e substituindo
    APENAS a área de conteúdo via layout:fragment="conteudo".

    NÃO é necessário incluir header nem footer aqui — o layout já faz isso.

    Dados recebidos do ConsultaController:
    - ${consulta}:  objeto Consulta (vazio para nova, preenchido para edição)
    - ${pacientes}, ${medicos}: listas para os selects
    - ${horarios}:  horários de atendimento (08:00 a 17:30, de 30 em 30 minutos)
    - ${tipos}:     valores do enum TipoConsulta
    - ${situacoes}: valores do enum StatusConsulta (usado só na edição)

    Verbo HTTP: consulta nova -> POST /consultas; edição -> PUT /consultas/{id}.
    th:method="put" faz o Thymeleaf gerar method="post" + <input type="hidden" name="_method" value="put">.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<!-- layout:decorate="~{layout}" indica que esta página herda o layout.html -->
<head>
    <title>Formulário de Consulta</title>
</head>
<body>

<!-- layout:fragment="conteudo" substitui a área de conteúdo do layout mestre -->
<div layout:fragment="conteudo" th:with="nova=${consulta.id == null}">

    <h2 th:text="${nova ? 'Nova Consulta' : 'Editar Consulta'}"></h2>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-body">
                    <!--
                        VALIDAÇÃO (Bean Validation + regras de agenda no controller):
                        - novalidate desativa a validação do navegador; as mensagens vêm do BACK-END;
                        - th:errorclass="is-invalid" pinta o campo de vermelho quando há erro;
                        - th:errors="*{campo}" exibe a mensagem do campo.
                    -->
                    <form th:action="${nova} ? @{/consultas} : @{/consultas/{id}(id=${consulta.id})}"
                          th:method="${nova} ? 'post' : 'put'"
                          th:object="${consulta}" novalidate>

                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i> Corrija os campos destacados abaixo.
                        </div>

                        <!-- ===== Quem: paciente e médico ===== -->
                        <h5 class="text-primary"><i class="bi bi-people"></i> Paciente e médico</h5>
                        <div class="row">
                            <!-- Paciente identificado por nome e CPF (evita confundir homônimos) -->
                            <div class="col-md-6 mb-3">
                                <label for="paciente" class="form-label">Paciente</label>
                                <select class="form-select" id="paciente" th:field="*{paciente.id}"
                                        th:classappend="${#fields.hasErrors('paciente')} ? 'is-invalid'">
                                    <option value="">Selecione um paciente</option>
                                    <option th:each="p : ${pacientes}" th:value="${p.id}"
                                            th:text="${p.nome + ' — ' + p.cpf}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('paciente')}" th:errors="*{paciente}"></div>
                            </div>
                            <!--
                                Médico com a especialidade. data-valor guarda o valor da consulta
                                do médico, usado pelo script no fim da página para sugerir o valor.
                            -->
                            <div class="col-md-6 mb-3">
                                <label for="medico" class="form-label">Médico</label>
                                <select class="form-select" id="medico" th:field="*{medico.id}"
                                        th:classappend="${#fields.hasErrors('medico')} ? 'is-invalid'">
                                    <option value="">Selecione um médico</option>
                                    <option th:each="m : ${medicos}" th:value="${m.id}" th:data-valor="${m.valorConsulta}"
                                            th:text="${m.nome + ' — ' + m.especialidade}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('medico')}" th:errors="*{medico}"></div>
                            </div>
                        </div>

                        <!-- ===== Quando: data e horário ===== -->
                        <h5 class="text-primary mt-2"><i class="bi bi-calendar3"></i> Data e horário</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="data" class="form-label">Data</label>
                                <input type="date" class="form-control" id="data" th:field="*{data}"
                                       th:errorclass="is-invalid">
                                <div class="form-text">Atendimento de segunda a sexta-feira.</div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></div>
                            </div>
                            <!-- Horários fixos de 30 em 30 minutos: o conflito de agenda é verificado no controller -->
                            <div class="col-md-6 mb-3">
                                <label for="horario" class="form-label">Horário</label>
                                <select class="form-select" id="horario" th:field="*{horario}" th:errorclass="is-invalid">
                                    <option value="">Selecione um horário</option>
                                    <option th:each="h : ${horarios}" th:value="${h}" th:text="${h}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('horario')}" th:errors="*{horario}"></div>
                            </div>
                        </div>

                        <!-- ===== Detalhes: tipo, situação, valor e observação ===== -->
                        <h5 class="text-primary mt-2"><i class="bi bi-clipboard2-pulse"></i> Detalhes</h5>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="tipo" class="form-label">Tipo</label>
                                <select class="form-select" id="tipo" th:field="*{tipo}" th:errorclass="is-invalid">
                                    <option value="">Selecione</option>
                                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descricao}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                            </div>

                            <!-- Situação: só aparece na edição; toda consulta nova começa como AGENDADA -->
                            <div class="col-md-4 mb-3" th:unless="${nova}">
                                <label for="status" class="form-label">Situação</label>
                                <select class="form-select" id="status" th:field="*{status}" th:errorclass="is-invalid">
                                    <option th:each="s : ${situacoes}" th:value="${s}" th:text="${s.descricao}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                            </div>
                            <div class="col-md-4 mb-3" th:if="${nova}">
                                <label class="form-label">Situação</label>
                                <div><span class="badge text-bg-primary fs-6">Agendada</span></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="valor" class="form-label">Valor (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="valor" th:field="*{valor}"
                                       th:errorclass="is-invalid" placeholder="Escolha o médico">
                                <div class="form-text">Sugerido pelo valor do médico; pode ser alterado.</div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="observacao" class="form-label">Observação</label>
                            <textarea class="form-control" id="observacao" th:field="*{observacao}" rows="3"
                                      th:errorclass="is-invalid" placeholder="Motivo da consulta, exames para levar..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('observacao')}" th:errors="*{observacao}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Salvar
                            </button>
                            <a th:href="@{/consultas}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!--
        Valor sugerido: ao escolher o médico, copia o valor da consulta dele
        (atributo data-valor da opção) para o campo Valor.
    -->
    <script>
        document.getElementById('medico').addEventListener('change', function () {
            const valor = this.options[this.selectedIndex].dataset.valor;
            if (valor) {
                document.getElementById('valor').value = valor;
            }
        });
    </script>

</div>

</body>
</html>
