# =====================================================
# Mensagens de erro de CONVERSÃO de tipo (typeMismatch)
# =====================================================
# Erros de conversão acontecem ANTES do Bean Validation, quando o texto
# enviado pelo formulário não pode ser convertido para o tipo do atributo
# (ex.: "abc" em um campo Double). Sem estas chaves, o Spring exibiria
# uma mensagem técnica em inglês ("Failed to convert property value...").
# O Spring Boot carrega este arquivo automaticamente como MessageSource.
typeMismatch=Valor inválido.
typeMismatch.java.lang.Double=Informe um número válido (ex.: 150.00).
typeMismatch.java.lang.Long=Selecione uma opção válida.
typeMismatch.java.time.LocalDateTime=Informe uma data e hora válidas.
typeMismatch.java.time.LocalDate=Informe uma data válida.
